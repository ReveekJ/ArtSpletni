name: Build and publish images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: reg.reveek-io.ru
  BACKEND_IMAGE: reg.reveek-io.ru/artspletni-backend
  FRONTEND_IMAGE: reg.reveek-io.ru/artspletni-frontend

jobs:
  validate:
    runs-on: arc-runners
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spletni
          POSTGRES_PASSWORD: spletni
          POSTGRES_DB: spletni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spletni -d spletni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"

      - name: Check server
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://spletni:spletni@localhost:5432/spletni_test
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app tests
          uv run pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

  publish:
    needs: validate
    runs-on: arc-runners
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=artspletni-backend
          cache-to: type=gha,mode=max,scope=artspletni-backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=artspletni-frontend
          cache-to: type=gha,mode=max,scope=artspletni-frontend