[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --log-cli-level=WARNING
    --log-level=WARNING
markers =
    auth: Authentication tests
    admin: Admin route builder tests
    routes: Public routes tests
    nfc: NFC endpoint tests
    cycle: Cycle prevention tests
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
