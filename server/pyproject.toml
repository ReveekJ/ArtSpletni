[project]
name = "spletni-server"
version = "0.1.0"
description = "Spletni: NFC-driven city gossip routes"
requires-python = ">=3.12"
dependencies = [
    "advanced-alchemy[uuid]>=1.12.0",
    "asyncpg>=0.32.0",
    "google-cloud-translate>=3.28.0",
    "httpx>=0.28.1",
    "litestar-email[smtp]>=0.4.0",
    "litestar[standard]>=2.25.0",
    "msgspec>=0.22.0",
    "obstore>=0.12.1",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-databases[postgres]>=0.19.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "TID", "ANN"]
ignore = ["RUF001", "RUF003", "RUF012", "E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_explicit = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::sqlalchemy.exc.SADeprecationWarning"]
markers = [
    "auth: accounts, sessions, guests, password reset, Yandex ID",
    "media: media uploads",
    "i18n: localization and machine translation",
    "points: points, content and NFC tags",
    "routes: route building, validation and progress rules",
    "runs: scanning, route runs and guest progress",
    "offers: partners, offers and redemptions",
    "achievements: achievement rules, rewards and seeding",
    "submissions: user gossip submissions and moderation",
    "analytics: playback reporting and admin dashboards",
    "gossip: LLM-written nearby stories about points",
]
